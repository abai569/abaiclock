<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>您的本地时间 - Analogue Clock</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0c;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #ffffff;
            overflow: hidden;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        .main-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 480px;
        }

        /* 顶部标题 */
        .page-title {
            font-size: 0.95rem;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.45);
            letter-spacing: 1px;
            margin-bottom: 20px;
        }

        /* 表盘外层容器 */
        .clock-box {
            position: relative;
            width: 320px;
            height: 320px;
            margin-bottom: 28px;
        }

        .clock-face {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: #0d0d10;
            border: 6px solid #caa055;
            box-shadow: 0 0 1px 1px rgba(202, 160, 85, 0.3);
            position: relative;
        }

        /* 刻度线 */
        .tick-item {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
        }

        .tick-item::before {
            content: '';
            display: block;
            background: #caa055;
            border-radius: 1px;
        }

        .tick-item.major::before {
            width: 2.5px;
            height: 10px;
            margin-top: 5px;
        }

        .tick-item.minor::before {
            width: 1px;
            height: 5px;
            margin-top: 5px;
            opacity: 0.35;
        }

        /* 表盘数字 */
        .number-slot {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            text-align: center;
        }

        .number-text {
            display: inline-block;
            font-size: 1.6rem;
            font-weight: 700;
            color: #ffffff;
            margin-top: 22px;
            font-family: system-ui, -apple-system, sans-serif;
        }

        /* 指针统一样式 */
        .hand {
            position: absolute;
            bottom: 50%;
            left: 50%;
            transform-origin: bottom center;
            z-index: 10;
        }

        /* 时针 */
        .hour-hand {
            width: 7px;
            height: 78px;
            background: #f1ebd9;
            border-radius: 4px;
            margin-left: -3.5px;
            margin-bottom: -10px;
            transform-origin: center calc(100% - 10px);
        }

        /* 分针 */
        .minute-hand {
            width: 5px;
            height: 118px;
            background: #f1ebd9;
            border-radius: 3px;
            margin-left: -2.5px;
            margin-bottom: -15px;
            transform-origin: center calc(100% - 15px);
        }

        /* 秒针与末端小球 */
        .second-hand {
            width: 1px;
            height: 180px;
            background: #e0524c;
            margin-left: -0.5px;
            margin-bottom: -32px;
            transform-origin: center calc(100% - 32px);
            z-index: 12;
        }

        .second-hand::after {
            content: '';
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 9px;
            height: 9px;
            background: #e0524c;
            border-radius: 50%;
        }

        /* 中心金属铆钉 */
        .center-cap-outer {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 15px;
            height: 15px;
            background: #caa055;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .center-cap-inner {
            width: 5px;
            height: 5px;
            background: #0d0d10;
            border-radius: 50%;
        }

        /* 表盘中心品牌印记 */
        .brand-label {
            position: absolute;
            top: 55%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.72rem;
            letter-spacing: 3.5px;
            color: rgba(255, 255, 255, 0.12);
            font-family: "Times New Roman", Times, serif;
            text-transform: uppercase;
            width: 80%;
            text-align: center;
            user-select: none;
        }

        /* 底部数字时间 */
        .digital-clock {
            font-size: 2.8rem;
            font-weight: 300;
            color: #ffffff;
            letter-spacing: 1px;
            margin-bottom: 6px;
            font-variant-numeric: tabular-nums;
        }

        /* 日期与星期 */
        .date-info {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.38);
            letter-spacing: 0.5px;
        }

        /* 悬浮设置控制按钮 */
        .fullscreen-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 38px;
            height: 38px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.4);
            transition: all 0.2s ease;
        }

        .fullscreen-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
        }

        .settings-wrapper {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 100;
        }

        .settings-toggle {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.2);
            font-size: 16px;
            cursor: pointer;
            transition: color 0.2s;
        }

        .settings-toggle:hover {
            color: rgba(255, 255, 255, 0.8);
        }

        .settings-card {
            position: absolute;
            bottom: 36px;
            right: 0;
            background: #15161b;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            opacity: 0;
            pointer-events: none;
            transform: translateY(8px);
            transition: all 0.2s ease;
            white-space: nowrap;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .settings-card.active {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }

        .control-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.8);
            cursor: pointer;
        }

        .control-row input[type="checkbox"] {
            accent-color: #caa055;
        }

        .brand-input-box {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-top: 4px;
            border-top: 1px stroke rgba(255, 255, 255, 0.1);
            padding-top: 8px;
        }

        .brand-input-box input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 4px;
            padding: 4px 8px;
            color: #fff;
            font-size: 0.8rem;
            outline: none;
        }

        .is-hidden {
            display: none !important;
        }

        @media (max-width: 360px) {
            .clock-box {
                width: 270px;
                height: 270px;
            }
            .number-text {
                font-size: 1.35rem;
                margin-top: 18px;
            }
            .hour-hand { height: 65px; }
            .minute-hand { height: 98px; }
            .second-hand { height: 125px; }
        }
    </style>
</head>
<body>
    <div class="main-wrapper">
        <div class="page-title" id="pageTitle">您的本地时间</div>
        
        <div class="clock-box" id="clockBox">
            <div class="clock-face" id="clockFace">
                <div class="brand-label" id="brandLabel">ANALOGUECLOCK</div>
                
                <div class="hand hour-hand" id="hourHand"></div>
                <div class="hand minute-hand" id="minuteHand"></div>
                <div class="hand second-hand" id="secondHand"></div>
                
                <div class="center-cap-outer">
                    <div class="center-cap-inner"></div>
                </div>
            </div>
        </div>

        <div class="digital-clock" id="digitalClock">00:00</div>

        <div class="date-info">
            <span id="dateText">0000年0月0日</span>
            <span id="weekdayText">星期一</span>
        </div>
    </div>

    <button class="fullscreen-btn" onclick="toggleFullscreen()" title="全屏">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/>
        </svg>
    </button>

    <div class="settings-wrapper">
        <div class="settings-card" id="settingsCard">
            <label class="control-row">
                <span>数字时间</span>
                <input type="checkbox" id="chkDigital" checked onchange="toggleElement('digitalClock', this.checked)">
            </label>
            <label class="control-row">
                <span>模拟表盘</span>
                <input type="checkbox" id="chkClock" checked onchange="toggleElement('clockBox', this.checked)">
            </label>
            <label class="control-row">
                <span>日期显示</span>
                <input type="checkbox" id="chkDate" checked onchange="toggleElement('dateText', this.checked)">
            </label>
            <label class="control-row">
                <span>星期显示</span>
                <input type="checkbox" id="chkWeekday" checked onchange="toggleElement('weekdayText', this.checked)">
            </label>
            <label class="control-row">
                <span>品牌标识</span>
                <input type="checkbox" id="chkBrand" checked onchange="toggleElement('brandLabel', this.checked)">
            </label>
            <div class="brand-input-box">
                <span style="font-size: 0.72rem; color: rgba(255,255,255,0.4);">自定义品牌名称</span>
                <input type="text" id="brandInput" value="ANALOGUECLOCK" oninput="updateBrandText(this.value)">
            </div>
        </div>
        <button class="settings-toggle" onclick="toggleSettings(event)">⚙</button>
    </div>

    <script>
        function buildClockFace() {
            const clockFace = document.getElementById('clockFace');

            // 1. 生成 60 刻度线
            for (let i = 0; i < 60; i++) {
                const tick = document.createElement('div');
                const isMajor = i % 5 === 0;
                tick.className = `tick-item ${isMajor ? 'major' : 'minor'}`;
                tick.style.transform = `rotate(${i * 6}deg)`;
                clockFace.appendChild(tick);
            }

            // 2. 生成数字 1~12
            for (let i = 1; i <= 12; i++) {
                const slot = document.createElement('div');
                slot.className = 'number-slot';
                const angle = i * 30;
                slot.style.transform = `rotate(${angle}deg)`;
                
                const num = document.createElement('div');
                num.className = 'number-text';
                num.textContent = i;
                num.style.transform = `rotate(${-angle}deg)`;
                
                slot.appendChild(num);
                clockFace.appendChild(slot);
            }
        }

        function renderClock() {
            const now = new Date();
            const hours = now.getHours();
            const minutes = now.getMinutes();
            const seconds = now.getSeconds();
            const ms = now.getMilliseconds();
            
            const hourDeg = ((hours % 12) * 30) + (minutes * 0.5);
            const minuteDeg = (minutes * 6) + (seconds * 0.1);
            const secondDeg = (seconds * 6) + (ms * 0.006);
            
            document.getElementById('hourHand').style.transform = `rotate(${hourDeg}deg)`;
            document.getElementById('minuteHand').style.transform = `rotate(${minuteDeg}deg)`;
            document.getElementById('secondHand').style.transform = `rotate(${secondDeg}deg)`;
            
            const timeStr = `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}`;
            document.getElementById('digitalClock').textContent = timeStr;
            
            const year = now.getFullYear();
            const month = now.getMonth() + 1;
            const day = now.getDate();
            const weekNames = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
            
            document.getElementById('dateText').textContent = `${year}年${month}月${day}日`;
            document.getElementById('weekdayText').textContent = weekNames[now.getDay()];

            requestAnimationFrame(renderClock);
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(e => console.log(e));
            } else {
                document.exitFullscreen();
            }
        }

        function updateBrandText(val) {
            document.getElementById('brandLabel').textContent = val;
            localStorage.setItem('clock_custom_brand', val);
        }

        function toggleElement(id, visible) {
            const el = document.getElementById(id);
            if (!el) return;
            if (visible) el.classList.remove('is-hidden');
            else el.classList.add('is-hidden');
            localStorage.setItem('clock_show_' + id, visible);
        }

        function initSettings() {
            const items = [
                { id: 'digitalClock', chk: 'chkDigital' },
                { id: 'clockBox', chk: 'chkClock' },
                { id: 'dateText', chk: 'chkDate' },
                { id: 'weekdayText', chk: 'chkWeekday' },
                { id: 'brandLabel', chk: 'chkBrand' }
            ];

            items.forEach(item => {
                const saved = localStorage.getItem('clock_show_' + item.id);
                if (saved !== null) {
                    const isVisible = saved === 'true';
                    document.getElementById(item.chk).checked = isVisible;
                    toggleElement(item.id, isVisible);
                }
            });

            const savedBrand = localStorage.getItem('clock_custom_brand');
            if (savedBrand !== null) {
                document.getElementById('brandInput').value = savedBrand;
                document.getElementById('brandLabel').textContent = savedBrand;
            }
        }

        function toggleSettings(e) {
            e.stopPropagation();
            document.getElementById('settingsCard').classList.toggle('active');
        }

        document.addEventListener('click', (e) => {
            const card = document.getElementById('settingsCard');
            if (card.classList.contains('active') && !e.target.closest('.settings-wrapper')) {
                card.classList.remove('active');
            }
        });

        buildClockFace();
        initSettings();
        requestAnimationFrame(renderClock);
    </script>
</body>
</html>
