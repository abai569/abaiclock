name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release --split-per-abi
      - name: Rename APKs
        shell: bash
        run: |
          for abi in arm64-v8a armeabi-v7a x86_64; do
            src="build/app/outputs/flutter-apk/app-${abi}-release.apk"
            dst="build/app/outputs/flutter-apk/abaiclock-${GITHUB_REF_NAME}-${abi}.apk"
            if [ -f "$src" ]; then
              mv "$src" "$dst"
            fi
          done
      - uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/abaiclock-${{ github.ref_name }}-*.apk