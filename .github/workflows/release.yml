name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
      - name: Rename APK
        shell: bash
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          mv build/app/outputs/flutter-apk/app-release.apk abaiclock-${VERSION}.apk
          sha256sum abaiclock-${VERSION}.apk > abaiclock-${VERSION}.apk.sha256
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            abaiclock-*.apk
            abaiclock-*.apk.sha256
          generate_release_notes: true