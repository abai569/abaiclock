name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      
      # 创建固定的签名密钥
      - name: Create signing keystore
        run: |
          keytool -genkey -v -keystore android/app/abaiclock.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias abaiclock \
            -storepass abaiclock123 \
            -keypass abaiclock123 \
            -dname "CN=abaiclock, OU=dev, O=abaiclock, L=Beijing, ST=Beijing, C=CN"
          
          cat > android/app/key.properties <<EOF
          storeFile=abaiclock.jks
          storePassword=abaiclock123
          keyAlias=abaiclock
          keyPassword=abaiclock123
          EOF
      
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release --split-per-abi
      - name: Rename APKs
        shell: bash
        run: |
          for abi in arm64-v8a armeabi-v7a x86_64; do
            src="build/app/outputs/flutter-apk/app-${abi}-release.apk"
            dst="build/app/outputs/flutter-apk/abaiclock-${GITHUB_REF_NAME}-${abi}.apk"
            if [ -f "$src" ]; then
              mv "$src" "$dst"
            fi
          done
      - uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/abaiclock-${{ github.ref_name }}-*.apk